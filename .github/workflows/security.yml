name: Code Security & Strix Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  codeql-analysis:
    name: GitHub CodeQL Security Scan (JS/Web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  strix-scan:
    name: Strix AI Pentest & Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Required for diff-scope resolution

      - name: Install Strix CLI
        run: curl -sSL https://strix.ai/install | bash

      - name: Run Strix Security Scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM || 'openai/gpt-4o' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::notice::LLM_API_KEY is not configured in repository secrets. To enable Strix AI-powered pentest, please add LLM_API_KEY to Settings > Secrets > Actions."
            exit 0
          fi
          strix -n -t ./ --scan-mode quick --max-budget 10

      - name: Fail unless the scan completed
        if: always()
        run: |
          if [ -d "strix_runs" ]; then
            run_json=$(ls -t strix_runs/*/run.json 2>/dev/null | head -1)
            if [ -n "$run_json" ] && [ -f "$run_json" ]; then
              status=$(jq -r .status "$run_json")
              if [ "$status" != "completed" ]; then
                echo "::error::Strix run status is '$status' — the scan did not complete (likely budget exhausted). Raise --max-budget." >&2
                exit 1
              fi
            fi
          fi

      - name: Upload Strix SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: strix_runs
        continue-on-error: true
