# ==============================================================================
# 🛡️ Ras ALmal Tycoon — Fortified Nginx Security Block for rasalmal.online
# ==============================================================================

# 1. Disable server version tokens
server_tokens off;

# 2. Security shield: block internal directories and files
location ~* ^/(backups|tasks|scripts|server|uploads/private|\.git|\.env) {
    deny all;
    return 404;
}

# 3. PostgREST RPC Access (Allows execution of secure SQL stored procedures like money drops & transfers)
location /rest/v1/rpc/ {
    proxy_pass http://127.0.0.1:8000/rest/v1/rpc/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header x-app-version;
}

# 4. PostgREST Lockdown (Defense-in-Depth against direct Burp/curl PATCH attacks)
# Restricts public mutations on PostgREST endpoints; only GET/HEAD/OPTIONS are allowed from outside.
location /rest/v1/ {
    limit_except GET HEAD OPTIONS {
        allow 127.0.0.1;
        deny all;
    }
    proxy_pass http://127.0.0.1:8000/rest/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header x-app-version;
}

# 4. Route API requests to the Authoritative Node.js Server
location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    
    # Headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Timeouts & Buffering
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering off;
}

# 5. Direct health check route
location /health {
    proxy_pass http://127.0.0.1:3001/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
