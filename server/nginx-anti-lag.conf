# ==============================================================================
# Ras ALmal Tycoon — High-Performance Nginx Anti-Lag & Flood Defense Configuration
#
# How to apply on Ubuntu VPS:
# 1. Place this file in: /etc/nginx/conf.d/rasalmal-anti-lag.conf
#    (or merge into /etc/nginx/sites-available/rasalmal)
# 2. Verify with: nginx -t
# 3. Reload with: systemctl reload nginx
# ==============================================================================

# 1. Shared memory zone for API rate limiting (10MB holds ~160,000 unique IPs)
# 15 requests per second per IP is generous for fast players, but stops flood tools
limit_req_zone $binary_remote_addr zone=rasalmal_api_flood:10m rate=15r/s;

# 2. Connection limit zone (defends against socket exhaustion and Slowloris attacks)
limit_conn_zone $binary_remote_addr zone=rasalmal_conn_limit:10m;

